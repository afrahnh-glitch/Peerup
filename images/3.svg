<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bulbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0C2"/>
      <stop offset="100%" stop-color="#F2B77A"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="100" cy="88" r="62" fill="#FFE0C2" opacity="0.25"/>

  <!-- rays -->
  <g stroke="#E2924B" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="16" x2="100" y2="30"/>
    <line x1="46" y1="40" x2="56" y2="50"/>
    <line x1="154" y1="40" x2="144" y2="50"/>
    <line x1="30" y1="90" x2="44" y2="90"/>
    <line x1="170" y1="90" x2="156" y2="90"/>
  </g>

  <!-- bulb glass -->
  <path d="M100 34
           a46 46 0 0 1 28 82
           c-6 6 -8 14 -8 22
           h-40
           c0 -8 -2 -16 -8 -22
           a46 46 0 0 1 28 -82 Z" fill="url(#bulbGlow)"/>

  <!-- filament -->
  <path d="M88 86 L96 100 L88 114 L96 128" fill="none" stroke="#172554" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- base -->
  <rect x="80" y="138" width="40" height="10" rx="3" fill="#172554"/>
  <rect x="83" y="150" width="34" height="9" rx="3" fill="#172554"/>
  <rect x="86" y="161" width="28" height="10" rx="5" fill="#7C5CFC"/>
</svg>
