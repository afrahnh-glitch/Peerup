<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="planetBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B7CFF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65C7FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#65C7FF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- back half of ring -->
  <ellipse cx="100" cy="108" rx="92" ry="20" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.55" transform="rotate(-8 100 108)"/>

  <!-- planet body -->
  <circle cx="100" cy="96" r="52" fill="url(#planetBody)"/>
  <circle cx="82" cy="80" r="10" fill="#ffffff" opacity="0.18"/>
  <circle cx="118" cy="112" r="14" fill="#172554" opacity="0.12"/>
  <circle cx="70" cy="118" r="7" fill="#172554" opacity="0.10"/>

  <!-- front half of ring -->
  <path d="M 20 108 A 80 18 -8 0 0 180 100" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- tiny stars -->
  <g fill="#FAFAFC">
    <circle cx="30" cy="40" r="2.5"/>
    <circle cx="168" cy="55" r="2"/>
    <circle cx="150" cy="150" r="2.2"/>
    <circle cx="42" cy="160" r="1.8"/>
  </g>
</svg>
